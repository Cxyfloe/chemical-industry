# ============================================================
# gradle.properties — 项目属性配置
# 作用：定义模组版本号、Minecraft 版本等变量
# 在 build.gradle 中通过 ${变量名} 引用这些值
# ============================================================

# Minecraft 和模组加载器版本
minecraft_version = 1.21.1
neo_version = 21.1.80

# Create 模组版本（机械动力 1.21.1 版）
# 最新版本来自 https://maven.createmod.net
create_version = 6.0.9

# 本模组的基本信息
mod_id = chemical_industry
mod_name = Chemical Industry
mod_version = 0.1.0
mod_group_id = com.cxy.chemical_industry

# 作者信息
mod_authors = cxy
mod_description = A chemical industry addon for Create mod. Adds chemical processes, material synthesis, and industrial equipment.

# Java 版本（NeoForge 1.21.1 要求 Java 21）
java_version = 21

# 优化 Gradle 构建性能
org.gradle.jvmargs = -Xmx4G
org.gradle.daemon = true
org.gradle.parallel = true
